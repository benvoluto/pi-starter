name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: ./scripts/check-no-secrets.sh
      - name: templates are valid JSON
        run: for f in templates/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done
      - name: installer dry run into a temp dir
        run: PI_CODING_AGENT_DIR=$(mktemp -d) node install.mjs --dry-run
